[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vayu-climate-digital-twin"
version = "1.0.0"
description = "VAYU — India's first AI-powered Climate Digital Twin. GNN + Temporal Transformer for regional climate prediction."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.12",
    "xarray>=2024.1",
    "pandas>=2.2",
    "netCDF4>=1.6",
    "h5py>=3.11",
    "imdlib>=0.1.8",
    # PyTorch + PyTorch Geometric
    "torch>=2.2",
    "torch-geometric>=2.5",
    # FastAPI backend
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # Cache
    "redis>=5.0",
    "hiredis>=2.3",
    # Data processing
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "cartopy>=0.23",
    "metpy>=1.6",
    # Retry / HTTP
    "httpx>=0.27",
    "tenacity>=8.3",
    "tqdm>=4.66",
    # Visualization (server-side tiles)
    "matplotlib>=3.8",
    "Pillow>=10.3",
    # AWS SDK (optional)
    "boto3>=1.34",
    # Utils
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "click>=8.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
vayu-ingest = "data_ingestion.cli:ingest"
vayu-train = "ai_engine.trainer:train_cli"
vayu-serve = "backend.main:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.hatch.build.targets.wheel]
packages = [
    "ai_engine",
    "backend",
    "data_ingestion",
    "scenario_engine",
]

[tool.hatch.build.targets.sdist]
include = [
    "ai_engine",
    "backend",
    "data_ingestion",
    "scenario_engine",
    "pyproject.toml",
    "README.md",
]
