[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vayu-climate-digital-twin"
version = "1.0.0"
description = "VAYU climate digital twin backend and AI engine"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.4", "asyncpg==0.31.0", "awsiotsdk==1.26.0", "boto3==1.43.32",
  "cartopy==0.25.0", "dask==2024.11.2", "fastapi==0.137.2", "geoalchemy2==0.20.0", "h5py==3.16.0",
  "hiredis==3.4.0", "httpx==0.28.1", "imdlib==0.1.21", "matplotlib==3.11.0",
  "metpy==1.7.1", "netCDF4==1.7.4", "numpy==2.4.6", "paho-mqtt==2.1.0",
  "pandas==3.0.3", "pillow==12.2.0", "psycopg2-binary==2.9.12", "pydantic==2.13.4",
  "pyproj==3.7.2", "python-dotenv==1.2.2", "python-multipart==0.0.32", "rasterio==1.5.0",
  "redis==8.0.0", "scikit-learn==1.7.2", "scipy==1.17.1", "shapely==2.1.2",
  "sqlalchemy==2.0.51", "structlog==26.1.0", "tenacity==9.1.4", "torch==2.6.0+cu124",
  "torch-geometric==2.8.0", "tqdm==4.68.3", "typer==0.26.7", "uvicorn[standard]==0.49.0",
  "xarray==2026.4.0"
]

[project.optional-dependencies]
test = ["hypothesis==6.155.3", "pytest==9.1.0", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0"]
dev = ["hypothesis==6.155.3", "pytest==9.1.0", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0", "ruff==0.15.17"]

[project.scripts]
vayu-ai = "ai_engine.cli:main"

[tool.setuptools.packages.find]
include = ["ai_engine*", "backend*", "data_ingestion*", "scenario_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend"]
asyncio_mode = "auto"
