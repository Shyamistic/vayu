<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VAYU — India's first AI-powered Climate Digital Twin. Interactive 3D climate prediction and What-If scenario simulation for Western India." />
  <title>VAYU — Climate Digital Twin</title>
  <!-- CesiumJS requires specific CSS for the viewer container -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #0a0f1e; }
    /* CesiumJS canvas fills the viewport */
    .cesium-widget canvas { width: 100% !important; height: 100% !important; }
    /* Hide default Cesium branding */
    .cesium-credit-container { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
